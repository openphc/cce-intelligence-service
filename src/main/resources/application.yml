server:
  port: 8085

spring:
  application:
    name: cce-intelligence-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ccedb}
    username: ${DB_USERNAME:cce_user}
    password: ${DB_PASSWORD:cce_pass}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: cce-intelligence-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: org.openphc.cce.intelligence.kafka.model.IntelligenceTriggerEvent
        max.poll.records: 100
        max.poll.interval.ms: 300000
    listener:
      ack-mode: RECORD
      concurrency: 3

cce:
  kafka:
    topics:
      intelligence-triggers: cce.intelligence.triggers
      intelligence-triggers-dlq: cce.intelligence.triggers.dlq
  intelligence:
    webhook:
      connect-timeout-ms: 5000
      read-timeout-ms: 10000
      retry-attempts: 3
      retry-interval-ms: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
